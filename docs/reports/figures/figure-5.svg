nt-family='Inter, ui-sans-serif, system-ui, sans-serif'>running tail: 7.80 s</text><text x='40.0' y='205.0' font-size='11' text-anchor='start' fill='#6b6259' font-weight='normal' font-family='Inter, ui-sans-serif, system-ui, sans-serif'>Inside view, on the game's clock, relative to the worker phases:</text><circle cx='228.5' cy='223' r='5' fill='#1f1b16' stroke='#faf8f4' stroke-width='2'/><text x='238.5' y='227.0' font-size='11' text-anchor='start' fill='#1f1b16' font-weight='normal' font-family='Inter, ui-sans-serif, system-ui, sans-serif'>game listens, 0.57 s after its process starts</text><circle cx='233.5' cy='245' r='5' fill='#1f1b16' stroke='#faf8f4' stroke-width='2'/><text x='243.5' y='249.0' font-size='11' text-anchor='start' fill='#1f1b16' font-weight='normal' font-family='Inter, ui-sans-serif, system-ui, sans-serif'>worker's first /healthz hit</text><circle cx='314.3' cy='267' r='5' fill='#1f1b16' stroke='#faf8f4' stroke-width='2'/><text x='324.3' y='271.0' font-size='11' text-anchor='start' fill='#1f1b16' font-weight='normal' font-family='Inter, ui-sans-serif, system-ui, sans-serif'>last player slot ready</text><circle cx='605.7' cy='289' r='5' fill='#1f1b16' stroke='#faf8f4' stroke-width='2'/><text x='595.7' y='293.0' font-size='11' text-anchor='end' fill='#1f1b16' font-weight='normal' font-family='Inter, ui-sans-serif, system-ui, sans-serif'>game's measured loop ends</text></svg>